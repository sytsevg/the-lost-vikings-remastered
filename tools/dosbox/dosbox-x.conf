# DOSBox-X settings for running the original as the reference (ADR-0016, docs/dosbox.md).
# tools/dosbox.py passes this file; the game's working copy is mounted as C: by the command line.
[sdl]
output=surface

[dosbox]
# Plain VGA, as the game expects (not the default S3 SVGA).
machine=vgaonly
fastbioslogo=true
startbanner=false
memsize=16
# No message box after a capture (screenshots, OPL) when driven by tools/dosbox.py.
show recorded filename=false
# Never ask "Are you sure to quit?": without a terminal the question would repeat forever.
quit warning=false

[cpu]
core=normal
cputype=386
cycles=fixed 25000
# Fast forward: emulate as fast as the host can instead of in real time. With fixed cycles the emulated machine
# runs the same either way; only the wall clock differs.
turbo=true
stop turbo on key=false

[sblaster]
# A Sound Blaster Pro 2 with OPL3: runs driver 460 (Sound Blaster Pro FM) at its default
# port, IRQ and DMA (entry 0 words 5-8 = 0xFFFF).
sbtype=sbpro2
sbbase=220
irq=7
dma=1
oplmode=opl3

[speaker]
pcspeaker=false

[autoexec]
